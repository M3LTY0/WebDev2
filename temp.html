<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unit Converter</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <body class="bg-slate-100 min-h-screen">
    <header class="bg-white border-b border-slate-200">
      <div
        class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between"
      >
        <h1 class="text-lg font-bold text-slate-900">
          <a href="index.html">Unit Converter</a>
        </h1>

        <span
          class="text-xs font-semibold text-blue-700 bg-blue-100 px-3 py-1 rounded-full"
        >
          <nav>
            <a href="dist.html">Distance</a>
            <a href="weigh.html">Weight</a>
            <a href="temp.html">Temprature</a>
          </nav>
        </span>
      </div>
    </header>

    <section class="max-w-5xl mx-auto px-6 pt-12 pb-8 text-center">
      <h2 class="text-3xl sm:text-4xl font-bold text-slate-900">
        Temprature
      </h2>
    </section>

    <main class="max-w-w5xl mx-auto px-6 pb-16">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Farenheit to Celsius -->
        <div class="bg-white rounded-2xl shadow-md p-6">
          <h3 class="text-lg font-bold text-slate-900">Fahrenheit to Celsius</h3>

          <label
            for="fahrenheit-input"
            class="block text-sm font-medium text-slate-700 mt-5 mb-2"
          >
            Fahrenheit
          </label>
          <input
            id="fahrenheit-input"
            type="number"
            value="0"
            class="w-full rounded-lg border border-slate-300 px-4 py-2 text-slate-900 focus:border-violet-500 focus:outline-none"
          />
          <button
            id="fahrenheit-button"
            class="w-full mt-4 rounded-lg bg-violet-600 px-4 py-2 font-semibold text-white hover:bg-violet-700 transition cursor-pointer"
          >
            Convert
          </button>
          <div class="mt-5 rounded-lg bg-slate-50 p-4 text-center">
            <p class="text-xs uppercase tracking-wide text-slate-500">
              Celsius
            </p>
            <p
              id="fahrenheit-result"
              class="text-2xl font-bold text-violet-600 mt-1"
            >
              0.00
            </p>
          </div>
        </div>
        <!--Celsius to Fahrenheit-->
        <div class="bg-white rounded-2xl shadow-md p-6">
          <h3 class="text-lg font-bold text-slate-900">Celsius to Fahrenheit</h3>

          <label
            for="celsius-input"
            class="block text-sm font-medium text-slate-700 mt-5 mb-2"
          >
            Celsius
          </label>
          <input
            id="celsius-input"
            type="number"
            value="0"
            class="w-full rounded-lg border border-slate-300 px-4 py-2 text-slate-900 focus:border-violet-500 focus:outline-none"
          />
          <button
            id="celsius-button"
            class="w-full mt-4 rounded-lg bg-violet-600 px-4 py-2 font-semibold text-white hover:bg-violet-700 transition cursor-pointer"
          >
            Convert
          </button>
          <div class="mt-5 rounded-lg bg-slate-50 p-4 text-center">
            <p class="text-xs uppercase tracking-wide text-slate-500">
              Fahrenheit
            </p>
            <p
              id="celsius-result"
              class="text-2xl font-bold text-violet-600 mt-1"
            >
              0.00
            </p>
          </div>
        </div>
      </div>
    </main>
    <script src="./main.js"></script>
  </body>
  <footer class="bg-white border-t border-slate-200">
    <div class="max-w-5xl mx-auto px-6 py-6 text-center">
      <p class="text-sm text-slate-500">
        Built with Tailwind CSS and TypeScript &middot; CPRG 306 Web Development
        2
      </p>
    </div>
  </footer>
</html>
